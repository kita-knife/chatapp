[project]
name = "chatapp-api"
version = "0.1.0"
description = "ChatApp-PG FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "agno>=2.8.7",
    "asyncpg>=0.30",
    "bcrypt>=4.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "openai>=2.53.0",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
